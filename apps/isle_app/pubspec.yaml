name: isle_app
description: The Isle — citizen app for Saint Mary Liberty Island
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.0
  http: ^1.2.0
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  crypto: ^3.0.3
  models:
    git:
      url: https://github.com/PerfectFriend/simplex-node.git
      ref: v1.0.0-shared
      path: apps/shared/models
  api_client:
    git:
      url: https://github.com/PerfectFriend/simplex-node.git
      ref: v1.0.0-shared
      path: apps/shared/api_client
  widgets:
    git:
      url: https://github.com/PerfectFriend/simplex-node.git
      ref: v1.0.0-shared
      path: apps/shared/widgets

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/